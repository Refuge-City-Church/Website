# Deploys the site to GitHub Pages: https://refuge-city-church.github.io/website/
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/configure-pages@v6

      # Copy only the public site into _site (leave out tools, README, CMS config, repo files)
      - name: Build _site
        run: |
          mkdir _site
          tar -cf - --exclude=./.git --exclude=./.github --exclude=./_site \
            --exclude=./tools --exclude=./README.md --exclude=./.pages.yml \
            --exclude=./.gitignore --exclude=./shots . | tar -xf - -C _site
          find _site -maxdepth 1 | sort

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
